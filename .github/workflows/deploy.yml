name: Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production --base-href /nodus/

      - name: Add 404 fallback for Angular and SPA routes
        run: cp dist/nodus/browser/index.html dist/nodus/browser/404.html

      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/nodus/browser

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4